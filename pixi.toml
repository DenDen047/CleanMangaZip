[workspace]
name = "cleanmangazip"
version = "0.1.0"
description = "Clean and zip manga folders"
authors = ["DenDen047"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tasks]
run = "python main.py"
test = "pytest tests/"
lint = "ruff check ."
format = "ruff format ."

[dependencies]
python = ">=3.11,<3.13"
numpy = ">=2.0"
pillow = ">=11.0"
tqdm = ">=4.67"
ruff = "*"
pytest = "*"

[pypi-dependencies]
# Not available on osx-arm64 conda-forge → PyPI fallback.
pillow-avif-plugin = ">=1.5"
